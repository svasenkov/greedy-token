# Runnable copy of .github/_ethalon/publish.yml — edit ethalon first, then ./scripts/sync-github-workflows.sh.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-tests:
    name: require green Test workflow for release commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify mandatory Test matrix for tag commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/verify_release_matrix.py
          "${{ github.event.release.tag_name }}"

  publish:
    needs: verify-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
