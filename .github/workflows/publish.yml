# Runnable copy of .github/_ethalon/publish.yml — edit ethalon first, then ./scripts/sync-github-workflows.sh.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-tests:
    name: require green Test workflow for release commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify latest Test run for tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")
          RUNS=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs" \
            -f event=push \
            -f head_sha="${RELEASE_SHA}" \
            -f status=completed \
            -f per_page=100)
          LATEST_CONCLUSION=$(jq -r --arg sha "${RELEASE_SHA}" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")][0].conclusion // "missing"' \
            <<<"${RUNS}")
          if [ "${LATEST_CONCLUSION}" != "success" ]; then
            echo "Refusing publish: latest completed Test workflow for ${RELEASE_SHA} is ${LATEST_CONCLUSION}."
            exit 1
          fi
          echo "Test workflow gate passed for ${RELEASE_SHA}."

  publish:
    needs: verify-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
