# Workspace routes overlay — merge over bundled src/greedy_token/config/routes.yaml.
#
# Wire it up via $GREEDY_TOKEN_ROOT/.greedy-token.yaml:
#   routes_file: projects/greedy-token-home/greedy-token/examples/routes/workspace-routes.yaml
#
# Merge rules (over the bundled generic src/greedy_token/config/routes.yaml):
#   - same id  → this route replaces the bundled one (tool-rg-search below);
#   - new id   → prepended, so it wins tier tie-breaks against bundled routes.
#
# Tier order (tool-first): tool → python → ollama → rag → cursor
# First matching tier wins (best score within tier).

routes:
  - id: tool-rg-search
    target: tool
    tool: rg
    read_only: true
    patterns:
      - find
      - search for
      - grep
      - where is
      - where are
      - does
      - locate
      - look for
      - найди
      - найти
      - где лежит
      - где находится
      - где файл
      - покажи где
    note: "0 tokens — ripgrep before RAG/Cursor"
    globs:
      - "!.git/**"
      - "!node_modules/**"
      - "!build/**"
      - "!.venv/**"
      - "!.cursor/hooks/**"
      - "!.claude/hooks/**"
      - "!.devin/hooks/**"
    search_paths:
      - projects
      - docs
      - scripts
      - generators

  - id: tool-jq-manifest
    target: tool
    tool: jq
    read_only: true
    patterns:
      - jq
      - json field
      - parse json
      - phase-manifest json
    json_path: docs/phase-manifest.json
    jq_filter: .
    note: "Structured JSON lookup — jq, 0 LLM"

