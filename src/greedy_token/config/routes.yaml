# Task routing — generic defaults, portable across workspaces.
#
# Tier order (tool-first): tool → python → ollama → rag → cursor
# First matching tier wins (best score within tier).
#
# Workspace-specific routes live in $GREEDY_TOKEN_ROOT/.greedy-token.yaml
# (inline `routes:` or a `routes_file:` pointer) and are merged over these
# defaults: same id replaces the bundled route, new ids win tier tie-breaks.
# Example overlay: examples/routes/workspace-routes.yaml.
# Bootstrap: greedy-token init --routes-from FILE | --routes-scaffold.

routes:
  - id: tool-rg-search
    target: tool
    tool: rg
    read_only: true
    patterns:
      - find
      - search for
      - grep
      - where is
      - locate
      - look for
      - найди
      - найти
      - где лежит
      - где находится
      - где файл
      - покажи где
    note: "0 tokens — ripgrep before RAG/Cursor"
    globs:
      - "!.git/**"
      - "!node_modules/**"
      - "!build/**"
      - "!.venv/**"
      - "!.cursor/hooks/**"
    search_paths:
      - "."

  - id: rag-lookup
    target: rag
    patterns:
      - what is
      - how does
      - what does
      - difference between
      - что такое
      - объясни
      - расскажи
      - как работает
      - для чего
      - что значит
      - в чём разница
    domains: []
    note: "Docs/RAG lookup before full agent context"

  - id: cursor-wiring
    target: cursor
    patterns:
      - implement
      - refactor
      - fix bug
      - add component
      - header layout
      - spring backend
      - wiring
      - architecture
      - new feature
      - ui test class
    note: "One chat = one zone; use skill if listed"

  - id: python-rsync
    target: python
    read_only: false
    patterns:
      - rsync
      - migrate
      - phase1-rsync
      - mechanical copy
      - bulk copy
    command: ./scripts/migrate/phase1-rsync.sh
    note: "0 tokens — shell rsync"

  - id: python-meta-sync-check
    target: python
    read_only: true
    patterns:
      - check-meta-sync
      - meta sync
      - phase-manifest
      - phase manifest drift
      - skills-map sync
    command: python scripts/meta-sync-check.py
    note: "meta_sync_clean gate — crystallized script tier, 0 LLM"

  - id: python-gen-env
    target: python
    read_only: false
    patterns:
      - gen-env-configs
      - env config generate
      - properties sync script
    command: python stacks/java-spring/scripts/gen-env-configs.py
    note: "Deterministic config generation"

  - id: python-openapi-diff
    target: python
    read_only: true
    patterns:
      - openapi diff
      - contract drift
      - stacks/_contract
    command: python scripts/openapi-diff.py
    note: "contract_lint gate — crystallized script tier, 0 LLM"

  - id: python-java-matrix-plan
    target: python
    read_only: true
    patterns:
      - java matrix fanout
      - java matrix plan
      - selenium variant plan
    command: python scripts/java-matrix-plan.py
    note: "java-matrix-fanout plan — crystallized script tier, 0 LLM"

  - id: python-sonar-gate-wait
    target: python
    read_only: true
    patterns:
      - sonar gate
      - quality gate wait
      - sonar.qa.guru
    command: python scripts/sonar-gate-wait.py
    note: "sonar_quality_gate — crystallized script tier, 0 LLM"

  - id: python-crystallize-report
    target: python
    read_only: true
    patterns:
      - crystallize report
      - crystallize candidates
      - coverage report script
    command: python scripts/crystallize-report.py
    note: "script-crystallize candidates from usage.jsonl, 0 LLM"

  - id: python-configurator-boolean-audit
    target: python
    read_only: true
    patterns:
      - meta-audit configurator-boolean
      - configurator boolean audit
      - plaque-field-seg drift
    command: python scripts/configurator-boolean-audit.py
    note: "configurator-boolean canon drift gate — crystallized script tier, 0 LLM"

  - id: python-ssh-check
    target: python
    read_only: true
    patterns:
      - ssh check
      - ssh smoke
      - ssh access canon
      - qaguru ssh
      - infra ssh probe
    command: python scripts/infra-ssh/check.py
    note: "infra SSH smoke — crystallized script tier, 0 LLM"

  - id: python-auth-storage-probe
    target: python
    read_only: true
    patterns:
      - auth storage probe
      - auth_storage_probe
      - tms auth probe
      - testops auth storage
    command: python scripts/auth_storage_probe.py
    note: "TMS automator — crystallized auth/session probe (script tier)"

  - id: python-ollama-health
    target: python
    read_only: true
    patterns:
      - ollama doctor
      - ollama health
      - local model setup
      - ollama preset
    command: python scripts/ollama-health.py
    note: "Ollama health / presets — crystallized script tier"

  - id: python-greedy-context-smoke
    target: python
    read_only: true
    patterns:
      - context smoke
      - greedy context smoke
      - cheap tier smoke
      - context quality matrix
    command: python scripts/greedy-context-smoke.py
    note: "Cheap-tier context smoke matrix — crystallized script tier, 0 LLM"

  - id: python-rag-eval
    target: python
    read_only: true
    patterns:
      - rag eval
      - rag golden
      - rag retrieval recall
      - rag hit rate
    command: python scripts/rag-eval.py
    note: "RAG retrieval golden eval — recall@k/MRR by chunk id, 0 LLM"

  # shadow until 2026-08-05 — reject promote 2026-07-22: golden green, 0/3 hits
  - id: python-access-diag
    target: python
    read_only: true
    enabled: false
    shadow_until: "2026-08-05T00:00:00Z"
    patterns:
      - access diag
      - access-diag probe
      - service account access
      - jenkins access check
      - selenoid access probe
      - testops access probe
    command: python scripts/access_diag.py
    note: "Access-diag dispatcher — read-only probes, canon schema; shadow crystallize"

  # promoted 2026-07-22 — golden green; 0 shadow hits (criteria: golden only)
  - id: python-provider-balance
    target: python
    read_only: true
    patterns:
      - provider balance
      - balance analyzer
      - infra burn
    command: python scripts/infra/provider_balance.py
    note: "Provider balance analyzer — live script tier, 0 LLM"

cursor_fallback:
  message: |
    No exact route match — most likely a full agent (Cursor) task.
    Keep the chat scoped: one chat = one zone.
    Before the chat: greedy-token audit-context && greedy-token rag "<topic>".
