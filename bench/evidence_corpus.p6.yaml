# P6 extension evidence corpus — independent RU/EN acceptance cases authored
# for the product-direct acceptance run. Like v1 this file is frozen:
# corrections require a new corpus file, never an in-place prompt/oracle
# rewrite. It never modifies v1 ids, prompts, fixture or hashes.
schema_version: 1
corpus:
  id: greedy-token-p6-acceptance
  version: 6.0.0
  status: frozen
  frozen_at: "2026-10-08"
  languages: [en, ru]
  license: CC0-1.0
  extends: greedy-token-public-e2e-evidence@1.0.0
  provenance:
    id: synthetic-p6-acceptance-fixture
    kind: synthetic
    authoring_basis: task-specific observable oracles in an isolated workspace
    statement: >-
      Prompts were authored for the P6 acceptance corpus and were not copied
      from bench/route_examples.yaml, from route pattern entries, or from the
      frozen v1 corpus (disjoint case ids, disjoint fixture). The router is
      evaluated as shipped; benchmark work must not add or tune route
      patterns. Case completion categories are pre-declared in
      bench/evidence_benchmark.py (_COMPLETION_CATEGORY), not in this file.
    source_material:
      - bench fixture contents embedded below
      - public CLI and MCP contracts
  exclusions:
    training_data: false
    private_telemetry: false
    route_examples_reused: false
    route_patterns_reused_as_cases: false
    v1_corpus_modified: false
  comparison_methods:
    - direct_rg_or_script
    - greedy_cli
    - greedy_mcp_stdio
    - agent_baseline
  observed_scope_note: >-
    In deterministic mode every greedy row runs under the D1 python_provider
    observer. It denies all native launches (rg, script interpreters, sysctl)
    before they escape, so CLI tool/script plans and every MCP stdio row end
    coverage=incomplete — an honest evidence gap, not a product defect claim.
    Only pure-Python product computation (rag lookup) can reach
    coverage=complete. Thresholds below are declared against that boundary.
thresholds:
  route_accuracy_min: 1.0
  false_cheap_rate: 0.0
  greedy_executor_success_min: 0.5
  greedy_retrieval_success_min: 0.8
  greedy_cursor_escalation_min: 1.0
fixture:
  version: 1
  route_config_source: examples/routes/workspace-routes.yaml
  directories:
    - .cursor/rules
  files:
    projects/p6/settings.yaml: |
      # P6 evidence fixture.
      threshold: 0.75
      P6_GAMMA_SENTINEL: enabled
      P6_DELTA_SENTINEL: "значение-дельта"
      retries: 0
    .cursor/rules/p6.mdc: |
      P6 evidence fixture rule.
    docs/rag/manifest.jsonl: |
      {"id":"p6-quota-en","domain":"p6policy","path":"docs/rag/p6/quota-en.md","tags":["quota","ledger","scorecard"]}
      {"id":"p6-quota-ru","domain":"p6policy","path":"docs/rag/p6/quota-ru.md","tags":["квота","ledger","scorecard"]}
      {"id":"p6-fallback-playbook","domain":"p6policy","path":"docs/rag/p6/fallback-playbook.md","tags":["fallback","quota","ledger"]}
    docs/rag/p6/quota-en.md: |
      # Quota policy

      The deterministic benchmark stores quota decisions beside the scorecard.
      Every replay keeps the raw ledger hash and coverage status.
    docs/rag/p6/quota-ru.md: |
      # Квоты

      Детерминированный бенчмарк хранит решения по квотам рядом со scorecard.
      Каждый replay сохраняет хэш raw ledger и статус coverage.
    docs/rag/p6/fallback-playbook.md: |
      # Quota audit fallback

      When a code search finds nothing, the quota ledger playbook answers from
      the quota ledger domain instead, and the pipeline records the fallback
      transition next to the quota ledger evidence.
    projects/p6/blob.txt: |
      xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx P6_HUGE_SENTINEL 

cases:
  - id: p6-search-gamma-en
    provenance_id: synthetic-p6-acceptance-fixture
    lang: en
    family: search
    operation: search
    task: find P6_GAMMA_SENTINEL inside the p6 workspace
    expected_target: tool
    query: P6_GAMMA_SENTINEL
    scope: projects
    oracle:
      expected_exit_code: 0
      expected_files: [projects/p6/settings.yaml]
      expected_lines:
        - {path: projects/p6/settings.yaml, line: 3, contains: P6_GAMMA_SENTINEL}

  - id: p6-search-delta-ru
    provenance_id: synthetic-p6-acceptance-fixture
    lang: ru
    family: search
    operation: search
    task: найди P6_DELTA_SENTINEL в fixture workspace
    expected_target: tool
    query: P6_DELTA_SENTINEL
    scope: projects
    oracle:
      expected_exit_code: 0
      expected_files: [projects/p6/settings.yaml]
      expected_lines:
        - {path: projects/p6/settings.yaml, line: 4, contains: P6_DELTA_SENTINEL}

  - id: p6-search-miss-en
    provenance_id: synthetic-p6-acceptance-fixture
    lang: en
    family: search
    operation: search
    task: find P6_ABSENT_SENTINEL inside the p6 workspace
    expected_target: tool
    query: P6_ABSENT_SENTINEL
    scope: projects
    oracle:
      expected_exit_code: 0
      output_contains: ["No matches"]

  - id: p6-search-huge-en
    provenance_id: synthetic-p6-acceptance-fixture
    lang: en
    family: search
    operation: search
    task: find P6_HUGE_SENTINEL in the large blob file
    expected_target: tool
    query: P6_HUGE_SENTINEL
    scope: projects
    oracle:
      expected_exit_code: 0
      expected_files: [projects/p6/blob.txt]
      expected_lines:
        - {path: projects/p6/blob.txt, line: 1, contains: P6_HUGE_SENTINEL}
      output_contains: ["…"]

  - id: p6-rag-quota-en
    provenance_id: synthetic-p6-acceptance-fixture
    lang: en
    family: docs
    operation: rag
    task: How does the benchmark keep quota decisions?
    expected_target: rag
    query: quota decisions scorecard
    domain: p6policy
    oracle:
      expected_exit_code: 0
      expected_chunk_ids: [p6-quota-en]

  - id: p6-rag-quota-ru
    provenance_id: synthetic-p6-acceptance-fixture
    lang: ru
    family: docs
    operation: rag
    task: Как работает хранение квот-бенчмарка?
    expected_target: rag
    query: квоты scorecard ledger
    domain: p6policy
    oracle:
      expected_exit_code: 0
      expected_chunk_ids: [p6-quota-ru]

  - id: p6-fallback-ru
    provenance_id: synthetic-p6-acceptance-fixture
    lang: ru
    family: fallback
    operation: fallback
    task: найди P6_MISSING_SENTINEL при аудите политики квот
    expected_target: tool
    query: P6_MISSING_SENTINEL
    scope: projects
    mcp_pipeline: search P6_MISSING_SENTINEL path=projects then rag p6policy quota ledger
    oracle:
      expected_exit_code: 0
      expected_chunk_ids: [p6-fallback-playbook]
      expected_escalation: tool->rag

  - id: p6-falsecheap-en
    provenance_id: synthetic-p6-acceptance-fixture
    lang: en
    family: false-cheap-edit
    adversarial: true
    operation: escalation
    task: find P6_GAMMA_SENTINEL then rewrite the fixture parser to drop it
    expected_target: cursor
    oracle:
      expected_escalation: tool->cursor

  - id: p6-falsecheap-ru
    provenance_id: synthetic-p6-acceptance-fixture
    lang: ru
    family: false-cheap-edit
    adversarial: true
    operation: escalation
    task: найди P6_DELTA_SENTINEL и перепиши его во всех файлах
    expected_target: cursor
    oracle:
      expected_escalation: tool->cursor

  - id: p6-malformed-empty-en
    provenance_id: synthetic-p6-acceptance-fixture
    lang: en
    family: malformed
    operation: escalation
    task: ""
    expected_target: cursor
    oracle:
      expected_escalation: direct->cursor

  - id: p6-malformed-junk-ru
    provenance_id: synthetic-p6-acceptance-fixture
    lang: ru
    family: malformed
    operation: escalation
    task: "💥💥 %%##~~ §¶ — не задача"
    expected_target: cursor
    oracle:
      expected_escalation: direct->cursor

  - id: p6-large-task-ru
    provenance_id: synthetic-p6-acceptance-fixture
    lang: ru
    family: large-input
