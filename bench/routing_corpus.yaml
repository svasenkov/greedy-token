# Routing benchmark corpus v2 (post Trust cut).
# expected_target: tool | python | rag | ollama | cursor
# Scores route_task precision/recall — not unit coverage of helpers.
# confidence ≠ correctness; rag = lexical docs lookup (not embeddings).
version: 2
min_precision: 0.90
min_cases: 30
# Every listed target must appear ≥ min_per_target times (zone coverage).
min_per_target: 3
required_targets:
  - tool
  - python
  - rag
  - ollama
  - cursor
cases:
  # ── tool / search (EN) ───────────────────────────────────────────
  - id: find-baseurl
    task: find baseUrl in configurator-option-presets.html
    expected_target: tool
    lang: en
    family: search
  - id: where-is-header
    task: where is header.css defined
    expected_target: tool
    lang: en
    family: search
  - id: locate-header
    task: locate header.css
    expected_target: tool
    lang: en
    family: search
  - id: look-for-baseurl
    task: look for baseUrl
    expected_target: tool
    lang: en
    family: search
  - id: grep-selector
    task: grep for SELECTOR
    expected_target: tool
    lang: en
    family: search
  - id: jq-manifest
    task: parse json phase-manifest json
    expected_target: tool
    lang: en
    family: search

  # ── tool / search (RU) ───────────────────────────────────────────
  - id: find-flag-ru
    task: найди флаг baseUrl в репозитории
    expected_target: tool
    lang: ru
    family: search
  - id: naiti-selector-ru
    task: найти SELECTOR в репо
    expected_target: tool
    lang: ru
    family: search
  - id: gde-lezhit-ru
    task: где лежит header.js
    expected_target: tool
    lang: ru
    family: search
  - id: pokazhi-gde-ru
    task: покажи где baseUrl
    expected_target: tool
    lang: ru
    family: search

  # ── false-cheap edit → cursor (must not hold on tool/rag) ────────
  - id: fix-findings
    task: fix findings from review
    expected_target: cursor
    lang: en
    family: false-cheap-edit
  - id: search-and-fix
    task: search for race condition and fix it
    expected_target: cursor
    lang: en
    family: false-cheap-edit
  - id: find-and-patch
    task: find the flaky test and patch it
    expected_target: cursor
    lang: en
    family: false-cheap-edit
  - id: find-and-fix-selector
    task: find SELECTOR and fix it
    expected_target: cursor
    lang: en
    family: false-cheap-edit
  - id: search-todo-patch
    task: search for TODO and patch
    expected_target: cursor
    lang: en
    family: false-cheap-edit
  - id: find-and-fix-ru
    task: найди race condition и исправь
    expected_target: cursor
    lang: ru
    family: false-cheap-edit
  - id: pochini-ru
    task: найди баг и почини
    expected_target: cursor
    lang: ru
    family: false-cheap-edit
  - id: naiti-dubl-ru
    task: найди дубль и исправь
    expected_target: cursor
    lang: ru
    family: false-cheap-edit

  # ── wiring / judgment → cursor ───────────────────────────────────
  - id: refactor-header
    task: refactor monolithic header shell layout
    expected_target: cursor
    lang: en
    family: wiring
  - id: change-behavior
    task: change header behavior in one zone
    expected_target: cursor
    lang: en
    family: wiring
  - id: implement-header
