# Routing benchmark corpus v3 — held-out + adversarial release gate.
# expected_target: tool | python | rag | ollama | cursor
# Scores route_task classification only — not task execution/retrieval success.
# confidence ≠ correctness; rag = lexical docs lookup (not embeddings).
version: 3
split: held-out-adversarial
route_examples: route_examples.yaml
min_cases: 50
# Every listed target must appear ≥ min_per_target times (zone coverage).
min_per_target: 3
min_per_family: 3
required_targets:
  - tool
  - python
  - rag
  - ollama
  - cursor
thresholds:
  exact_match_accuracy: 0.95
  micro_precision: 0.95
  false_cheap_rate: 0.0
  per_target:
    tool: {precision: 0.90, recall: 0.90}
    python: {precision: 0.90, recall: 0.90}
    rag: {precision: 0.90, recall: 0.90}
    ollama: {precision: 0.90, recall: 0.90}
    cursor: {precision: 0.90, recall: 0.90}
  per_family:
    search: 0.90
    false-cheap-edit: 1.00
    wiring: 0.90
    docs: 0.90
    script: 0.90
    cheap-llm: 0.90
  per_language:
    en: 0.90
    ru: 0.90
cases:
  # ── tool / search (EN) ───────────────────────────────────────────
  - id: find-baseurl
    task: find baseUrl in configurator-option-presets.html
    expected_target: tool
    lang: en
    family: search
  - id: where-is-header
    task: where is header.css defined
    expected_target: tool
    lang: en
    family: search
  - id: locate-header
    task: locate header.css
    expected_target: tool
    lang: en
    family: search
  - id: look-for-baseurl
    task: look for baseUrl
